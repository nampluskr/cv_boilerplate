meta:
  task_name: classification
  description: "oxford_pets 37-breed classification baseline"

runtime:
  seed: 42
  device: cuda
  amp: false
  deterministic: warn
  allow_network: false

data:
  name: oxford_pets_cls
  root: /mnt/d/datasets/oxford_pets
  params: {}
  image_size: [224, 224]
  batch_size: 32
  num_workers: 4
  drop_last: false
  split:
    mode: file
    path: configs/splits/oxford_pets_subset_cls.json
  transform:
    train: {name: cls_train, params: {}}
    eval:  {name: cls_eval,  params: {}}

loss:
  name: cross_entropy
  params: {label_smoothing: 0.0}

metrics:
  - {name: top1_accuracy, params: {num_classes: 37}}
  - {name: macro_f1,      params: {num_classes: 37}}

adapter:
  name: classification
  params: {topk: 5}

optim:
  optimizer: {name: adamw,  params: {lr: 0.0003, weight_decay: 0.0001}}
  scheduler: {name: cosine, params: {t_max: 5, eta_min: 0.000001}}

train:
  epochs: 5
  grad_clip: null
  monitor: {metric: top1_accuracy, mode: max}
  log_interval: 10
  save_last: true

output:
  root: outputs
  run_name: null
  save_predictions: true
  save_visualizations: true
  max_visualizations: 16
