meta:
  task_name: anomaly
  description: "mvtec bottle anomaly detection baseline (PLAN-P5 SS8.1)"

runtime:
  seed: 42
  device: cuda
  amp: false
  deterministic: warn
  allow_network: false

data:
  name: mvtec_anomaly
  root: /mnt/d/datasets/mvtec
  params: {category: bottle}
  image_size: [256, 256]
  batch_size: 8
  num_workers: 4
  drop_last: false
  split:
    mode: file
    path: configs/splits/mvtec_bottle.json
  transform:
    train: {name: anomaly_default, params: {}}
    eval:  {name: anomaly_default, params: {}}

loss:
  name: none
  params: {}

metrics:
  - {name: image_auroc, params: {}}
  - {name: pixel_auroc, params: {}}

adapter:
  name: anomaly
  params: {smooth_sigma: 4.0}

optim:
  optimizer: {name: adamw,  params: {lr: 0.0001, weight_decay: 0.00001}}
  scheduler: {name: cosine, params: {t_max: 5, eta_min: 0.000001}}

train:
  epochs: 5
  grad_clip: null
  monitor: {metric: image_auroc, mode: max}
  log_interval: 10
  save_last: true

output:
  root: outputs
  run_name: null
  save_predictions: true
  save_visualizations: true
  max_visualizations: 16
